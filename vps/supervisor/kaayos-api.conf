[program:kaayos-api]
process_name=%(program_name)s
command=/usr/bin/npm run server
directory=/var/www/KaAyos-Mobile
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/kaayos-api.log
stopwaitsecs=30
environment=NODE_ENV="production",PORT="3000",PATH="/usr/local/bin:/usr/bin:/bin"

